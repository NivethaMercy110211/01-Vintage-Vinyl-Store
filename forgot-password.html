<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Forgot Password | Vinyl Classics</title>

  <link rel="icon" type="image/png" href="images/logo.png">

  <link rel="stylesheet" href="css/style.css?v=number-style-1">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <script src="https://unpkg.com/lucide@latest"></script>

</head>

<body class="auth-standalone">

  <section class="auth-page">

    <div class="auth-box">

      <a href="index.html" class="auth-brand" aria-label="Vinyl Classics Home">
        <img src="images/logo.png" alt="Vinyl Classics Logo" class="logo-img" width="52" height="52">
        <span class="logo-text">
          <span class="logo-title">Vinyl Classics</span>
          <span class="logo-subtitle">Vintage Record Store</span>
        </span>
      </a>

      <div class="auth-icon">

        <i data-lucide="key-round"></i>

      </div>

      <h2>Forgot Password</h2>

      <p>
        Enter your email address and we'll send you a link to reset your password.
      </p>

      <form id="forgotPasswordForm">

        <input type="email" placeholder="Email Address" required>

        <button type="submit" class="btn btn-primary">Send Reset Link</button>

      </form>

      <p class="auth-footer-link forgot-return-link">

        <span>Remember your password?</span>

        <a href="login.html">Back to Login</a>

      </p>

      <ul class="auth-benefits">
        <li><i data-lucide="disc-3"></i><span>Save favorite records and turntables.</span></li>
        <li><i data-lucide="bell"></i><span>Get alerts for rare drops and restocks.</span></li>
        <li><i data-lucide="ticket-check"></i><span>Access member listening events.</span></li>
      </ul>

    </div>

  </section>

  <script src="js/script.js?v=mobile-menu-highlight-2"></script>

</body>

</html>
