<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Vinyl Classics</title>
  <link rel="icon" type="image/png" href="images/logo.png">
  <link rel="stylesheet" href="css/style.css?v=auth-spacing-1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="auth-standalone">
  <main class="auth-page">
    <div class="auth-box">
      <a href="index.html" class="auth-brand" aria-label="Vinyl Classics Home">
        <img src="images/logo.png" alt="Vinyl Classics Logo" class="logo-img" width="52" height="52">
        <span class="logo-text">
          <span class="logo-title">Vinyl Classics</span>
          <span class="logo-subtitle">Vintage Record Store</span>
        </span>
      </a>

      <h2>Member Login</h2>
      <p>Sign in to save records, track cart picks, and get rare drop alerts.</p>

      <form>
        <input type="email" placeholder="Email Address" required>

        <div class="password-field">
          <input type="password" id="loginPassword" placeholder="Password" required>
          <button type="button" class="password-toggle" aria-label="Show password">
            <i data-lucide="eye"></i>
          </button>
        </div>

        <div class="auth-options">
          <label class="auth-check"><input type="checkbox"><span class="auth-toggle" aria-hidden="true"></span><span>Remember me</span></label>
          <a href="forgot-password.html">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary">Login</button>
      </form>

      <div class="auth-social">
        <button type="button"><span class="brand-mark google-mark" aria-hidden="true">G</span><span>Continue with Google</span></button>
        <button type="button"><span class="brand-mark apple-mark" aria-hidden="true">Apple</span><span>Continue with Apple</span></button>
      </div>

      <p class="auth-footer-link">
        Don't have an account?
        <a href="signup.html">Sign Up</a>
      </p>

      <ul class="auth-benefits">
        <li><i data-lucide="disc-3"></i><span>Save favorite records and turntables.</span></li>
        <li><i data-lucide="bell"></i><span>Get alerts for rare drops and restocks.</span></li>
        <li><i data-lucide="shopping-bag"></i><span>Return to your purchase picks faster.</span></li>
      </ul>
    </div>
  </main>

  <script src="js/script.js"></script>
</body>

</html>
